<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);const qs=s=>document.querySelectorAll(s);
let view=new Date(), diaries=read('mongul_diaries'), movies=read('mongul_movies');
let selectedDate='',selectedMood='',editingDiary=null,selectedMovie=null,rating=0,editingMovieIndex=-1,movieResults=[];
function read(k){try{const x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function persist(){localStorage.setItem('mongul_diaries',JSON.stringify(diaries));localStorage.setItem('mongul_movies',JSON.stringify(movies))}
function pad(n){return String(n).padStart(2,'0')} function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)} function today(){const d=new Date();return key(d.getFullYear(),d.getMonth(),d.getDate())}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function show(id){qs('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0);$('menuPanel').classList.add('hidden');if($('movieEditMenu'))$('movieEditMenu').classList.add('hidden');$('topbar').classList.toggle('hiddenTop',id!=='calendarScreen');if(typeof applyFont==='function')requestAnimationFrame(applyFont)}
function stars(n){n=Number(n)||0;let h='';for(let i=1;i<=5;i++){if(n>=i)h+='★';else if(n===i-.5)h+='◐';else h+='☆'}return h}
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth();$('year').textContent=y;$('month').textContent=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'][m];const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let h='';for(let i=0;i<first;i++)h+='<div class="blank"></div>';for(let d=1;d<=last;d++){const k=key(y,m,d),e=diaries.find(x=>x.date===k),dow=new Date(y,m,d).getDay();h+='<button class="day '+(dow===0?'sun ':'')+(dow===6?'sat ':'')+(k===today()?'today ':'')+'" data-date="'+k+'"><span class="dayNum">'+d+'</span>'+(e?'<span class="sticker">'+moodSvg(e.mood)+'</span>':'')+'</button>'}$('calendar').innerHTML=h;qs('.day').forEach(b=>b.onclick=()=>openDate(b.dataset.date))}
function monthMove(delta){const c=$('calendar');c.classList.remove('slideUp','slideDown');void c.offsetWidth;c.classList.add(delta<0?'slideDown':'slideUp');setTimeout(()=>{view.setMonth(view.getMonth()+delta);renderCalendar();c.classList.remove('slideUp','slideDown')},140)}
function moodSvg(type){const map={good:['#D9E9FF','M15 35 Q30 43 45 35','M14 24 q4 -4 8 0 M38 24 q4 -4 8 0'],excited:['#FFE0EF','M14 34 Q30 48 46 34','M14 25 q3 -5 6 0 M34 25 q3 -5 6 0'],happy:['#FFE69A','M12 34 Q30 47 48 34','M15 25 q3 -4 6 0 M33 25 q3 -4 6 0'],love:['#FFD0DA','M14 35 Q30 48 46 35','M15 25 q2 -3 4 0 M35 25 q2 -3 4 0'],calm:['#D9EEDB','M15 34 Q30 39 45 34','M15 25 Q18 28 21 25 M33 25 Q36 28 39 25'],sad:['#DDE8F7','M16 42 Q30 31 44 42','M15 25 q3 3 6 0 M33 25 q3 3 6 0'],tired:['#E8DDF2','M16 38 Q30 38 44 38','M14 25 l7 0 M33 25 l7 0'],angry:['#FFD2C5','M16 38 Q30 31 44 38','M14 24 l8 3 M32 27 l8 -3'],surprised:['#FFF0B9','M23 40 Q30 44 37 40','circle'],sorry:['#DDEFEA','M17 41 Q30 34 43 41','M14 25 q3 3 6 0 M33 25 q3 3 6 0'],plain:['#E8E8E8','M18 37 L42 37','M14 25 l7 0 M35 25 l7 0']};let k=type==='🥰'?'happy':type==='😊'?'good':type==='😍'?'excited':type==='😌'?'calm':type==='😢'?'sad':type==='😣'?'tired':type==='😡'?'angry':type==='😳'?'surprised':type==='🥺'?'sorry':'plain';const [bg,mouth,eyes]=map[k];let eyeSvg=eyes==='circle'?'<circle cx="30" cy="32" r="5" fill="none" stroke="#555" stroke-width="2"/>':'<path d="'+eyes+'" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/>';return '<svg class="moodIcon" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="'+bg+'"/><path d="'+mouth+'" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round"/>'+eyeSvg+'</svg>'}
function moodData(){return [['🥰','행복해요'],['😊','기분 좋아요'],['😍','설레요'],['😌','편안해요'],['😢','슬퍼요'],['😡','화나요'],['😣','지쳤어요'],['😳','놀랐어요'],['🤍','그냥 그래요']]}
function renderMoods(){ $('moods').innerHTML=moodData().map(x=>'<button class="mood" data-mood="'+x[0]+'">'+moodSvg(x[0])+'<span class="moodName">'+x[1]+'</span></button>').join('');qs('.mood').forEach(b=>b.onclick=()=>{selectedMood=b.dataset.mood;$('chosenMood').innerHTML=moodSvg(selectedMood);$('writeDate').textContent=selectedDate;$('diaryTitle').value=editingDiary?.title||'';$('diaryBody').value=editingDiary?.body||'';show('writeScreen')})}
function openDate(k){selectedDate=k;editingDiary=diaries.find(x=>x.date===k)||null;if(editingDiary){showDiaryDetail(editingDiary)}else{$('moodDate').textContent=k;renderMoods();show('moodScreen')}}
function renderDiaryList(){const a=diaries.slice().sort((x,y)=>String(y.date).localeCompare(String(x.date)));$('diaryList').innerHTML=a.length?a.map(e=>'<button class="diaryItem" data-date="'+esc(e.date)+'"><div class="emoji">'+esc(e.mood)+'</div><div class="grow"><div class="diaryItemTitle">'+esc(e.title||'제목 없는 하루')+'</div><div class="meta">'+esc(e.date)+'</div></div></button>').join(''):'<div class="searchEmpty">아직 기록한 일기가 없어요.</div>';qs('#diaryList .diaryItem').forEach(b=>b.onclick=()=>showDiaryDetail(diaries.find(x=>x.date===b.dataset.date)))}
function showDiaryDetail(e){editingDiary=e;selectedDate=e.date;$('diaryDetail').innerHTML='<div class="sub">'+esc(e.date)+'</div><div style="margin-top:16px">'+moodSvg(e.mood)+'</div><div class="detailTitle">'+esc(e.title||'오늘의 기록')+'</div><div class="detailBody">'+esc(e.body||'')+'</div><div class="detailActions"><button id="editDiary" class="outline">수정하기</button><button id="deleteDiary" class="outline">삭제하기</button></div>';show('diaryDetailScreen');$('editDiary').onclick=()=>editDiary();$('deleteDiary').onclick=()=>{diaries=diaries.filter(x=>x!==e);persist();renderCalendar();renderDiaryList();show('diaryListScreen')}}
function editDiary(){if(!editingDiary)return;selectedDate=editingDiary.date;selectedMood=editingDiary.mood;renderMoods();$('moodDate').textContent=selectedDate;$('writeDate').textContent=selectedDate;$('chosenMood').innerHTML=moodSvg(selectedMood);$('diaryTitle').value=editingDiary.title||'';$('diaryBody').value=editingDiary.body||'';show('writeScreen')}
function renderMovies(){const a=movies.map((e,i)=>({...e,_i:i})).sort((x,y)=>String(y.createdAt||y.date||'').localeCompare(String(x.createdAt||x.date||'')));$('movieList').innerHTML=a.length?a.map((e)=>'<button class="movieTile" data-id="'+e._i+'"><img src="'+esc(e.poster||'')+'" onerror="this.style.opacity=.15"><div class="movieTitle">'+esc(e.title)+'</div><div class="movieStars">'+stars(e.rating)+'</div></button>').join(''):'<div class="searchEmpty" style="grid-column:1/-1">아직 기록한 영화가 없어요.<br>＋에서 영화를 추가해보세요.</div>';qs('#movieList .movieTile').forEach(b=>b.onclick=()=>showMovieDetail(movies[Number(b.dataset.id)]))}
const posterDB={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('mongulPosterCache',1);r.onupgradeneeded=()=>r.result.createObjectStore('posters');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)})},async get(k){try{const db=await this.open();return await new Promise((res,rej)=>{const q=db.transaction('posters').objectStore('posters').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch(e){return null}},async put(k,v){try{const db=await this.open();db.transaction('posters','readwrite').objectStore('posters').put(v,k)}catch(e){}}};
async function warmPosterCache(url){if(!url)return;const old=await posterDB.get(url);if(old)return;try{const r=await fetch(url,{mode:'cors',cache:'force-cache'});if(r.ok){const b=await r.blob();await posterDB.put(url,b)}}catch(e){}}
async function restorePoster(img,url){if(!url)return;const b=await posterDB.get(url);if(b){const u=URL.createObjectURL(b);img.src=u;img.classList.add('posterCached');return}warmPosterCache(url)}
function tmdbKey(){
  var direct=(localStorage.getItem('mongul_tmdb_key')||'').trim();
  if(direct)return direct;
  /* 예전 버전에서 저장했을 수 있는 인증값도 그대로 복구 */
  var aliases=['mongul_tmdb_token','tmdb_access_token','tmdb_token','tmdb_api_key','TMDB_API_KEY','tmdbKey','tmdbToken'];
  for(var i=0;i<aliases.length;i++){var v=(localStorage.getItem(aliases[i])||'').trim();if(v){localStorage.setItem('mongul_tmdb_key',v);return v}}
  try{
    for(var j=0;j<localStorage.length;j++){
      var k=localStorage.key(j)||'';var v2=(localStorage.getItem(k)||'').trim();
      if(!v2)continue;
      if(/tmdb|movie.*api|api.*movie/i.test(k) && v2.length>=20){localStorage.setItem('mongul_tmdb_key',v2);return v2}
    }
  }catch(e){}
  return '';
}
function tmdbImage(path,size='w500'){return path?'https://image.tmdb.org/t/p/'+size+path:''}
function normalizeTitle(v){return String(v||'').toLowerCase().replace(/\s+/g,'').replace(/[\[\]().,:!?\-_/]/g,'')}
function scoreSearchItem(x,q){const n=normalizeTitle(x.title),qn=normalizeTitle(q);let score=0;if(n===qn)score+=100000;if(n.startsWith(qn))score+=30000;if(n.includes(qn))score+=10000;score+=(Number(x.popularity)||0)*20;score+=(Number(x.vote_count)||0)*0.15;return score}
async function tmdbFetch(path){
  const key=tmdbKey();
  if(!key)throw new Error('NO_TMDB_KEY');
  const base='https://api.themoviedb.org/3'+path;
  /* API Read Access Token은 Bearer, 구형 API Key는 query parameter로 사용 */
  const looksLikeBearer=key.length>40 || /^(eyJ|v4\.|[A-Za-z0-9_-]{50,})/.test(key);
  let url=base, opts={headers:{accept:'application/json'}};
  if(looksLikeBearer){opts.headers.Authorization='Bearer '+key}
  else{url=base+(path.includes('?')?'&':'?')+'api_key='+encodeURIComponent(key)}
  let r=await fetch(url,opts);
  /* 저장된 인증 형식이 애매한 경우 두 방식을 한 번 더 시도 */
  if(!r.ok && looksLikeBearer){
    const retry=base+(path.includes('?')?'&':'?')+'api_key='+encodeURIComponent(key);
    r=await fetch(retry,{headers:{accept:'application/json'}});
  }else if(!r.ok && !looksLikeBearer){
    r=await fetch(base,{headers:{accept:'application/json',Authorization:'Bearer '+key}});
  }
  if(!r.ok)throw new Error('TMDB_'+r.status);
  return r.json();
}
async function searchTMDB(q){const [m,t]=await Promise.all([tmdbFetch('/search/movie?query='+encodeURIComponent(q)+'&language=ko-KR&region=KR&include_adult=false&page=1'),tmdbFetch('/search/tv?query='+encodeURIComponent(q)+'&language=ko-KR&include_adult=false&page=1')]);const arr=[];for(const x of (m.results||[])){if(!x.poster_path)continue;arr.push({id:x.id,type:'movie',title:x.title||x.original_title||'',poster:tmdbImage(x.poster_path,'w342'),year:(x.release_date||'').slice(0,4),overview:x.overview||'',popularity:x.popularity||0,vote_count:x.vote_count||0,rating:x.vote_average||0})}for(const x of (t.results||[])){if(!x.poster_path)continue;arr.push({id:x.id,type:'tv',title:x.name||x.original_name||'',poster:tmdbImage(x.poster_path,'w342'),year:(x.first_air_date||'').slice(0,4),overview:x.overview||'',popularity:x.popularity||0,vote_count:x.vote_count||0,rating:x.vote_average||0})}arr.sort((a,b)=>scoreSearchItem(b,q)-scoreSearchItem(a,q));return arr.slice(0,24)}
async function searchMovies(){const q=$('movieQuery').value.trim();if(!q){$('movieResults').innerHTML='';return}$('movieResults').innerHTML='<div class="searchingSmall">영화·드라마를 찾는 중...</div>';const cacheKey='mongul_movie_search_v6_'+q.replace(/\s+/g,' ').trim().toLowerCase();try{let cached=read(cacheKey);if(cached.length){movieResults=cached;renderSearchResults(movieResults)}let fresh=[];if(tmdbKey()){try{fresh=await searchTMDB(q)}catch(e){fresh=[]}}if(!fresh.length)fresh=await searchKoreanScreenWorks(q);movieResults=fresh.slice(0,24);localStorage.setItem(cacheKey,JSON.stringify(movieResults));renderSearchResults(movieResults);movieResults.forEach(function(item){if(item.poster)warmPosterCache(item.poster)})}catch(e){if(!movieResults.length)$('movieResults').innerHTML='<div class="searchEmpty">검색을 불러오지 못했어요.<br><small>인터넷 연결을 확인해 주세요.</small></div>';renderSearchResults(movieResults)}}
async function searchKoreanScreenWorks(q){const queries=[q,q+' 영화',q+' 드라마'];const map=new Map();for(const term of queries){const url='https://ko.wikipedia.org/w/rest.php/v1/search/page?q='+encodeURIComponent(term)+'&limit=30';try{const d=await fetch(url).then(r=>r.json());for(const p of (d.pages||[])){const title=p.title||'';const desc=(p.description||'')+' '+(p.excerpt||'');if(!isScreenWork(title,desc,p.thumbnail?.url))continue;const clean=title.replace(/\s*\((영화|드라마|TV 시리즈|텔레비전 시리즈)\)\s*$/i,'');const exact=normalizeTitle(clean)===normalizeTitle(q);map.set(p.id||title,{title:clean,poster:toAbsWikiImage(p.thumbnail?.url||''),year:extractYear(desc),director:'',actors:'',release:'',overview:stripTags(p.excerpt||''),wiki:title,_exact:exact,_rank:map.size,_popularity:0})}}catch(e){}}let arr=[...map.values()];if(!arr.length)return[];try{const titles=arr.map(x=>x.wiki).join('|');const pv='https://ko.wikipedia.org/w/api.php?action=query&titles='+encodeURIComponent(titles)+'&prop=pageviews&pvipdays=30&format=json&origin=*';const vd=await fetch(pv).then(r=>r.json());const by={};Object.values(vd.query?.pages||{}).forEach(pg=>by[pg.title]=Object.values(pg.pageviews||{}).reduce((a,v)=>a+(Number(v)||0),0));arr.forEach(x=>x._views=by[x.wiki]||0)}catch(e){arr.forEach(x=>x._views=0)}arr.sort((a,b)=>{if(a._exact!==b._exact)return a._exact?-1:1;if((b._views||0)!==(a._views||0))return (b._views||0)-(a._views||0);return a._rank-b._rank});if(arr[0]){const exactFirst=arr.find(x=>x._exact)||arr[0];try{const poster=await findMoviePoster(exactFirst.title);if(poster)exactFirst.poster=poster}catch(e){}}return arr}

<script>
(function(){
'use strict';
/* 메뉴 화살표 상태를 실제 메뉴 상태와 항상 동기화 */
function syncHomeChevron(){

}
var oldHome=document.getElementById('homeBtn');
if(oldHome){
  oldHome.addEventListener('click',function(){requestAnimationFrame(syncHomeChevron);setTimeout(syncHomeChevron,0)});
}

}

  });
}

/* 영화 기록의 장소/누구랑 아이콘을 SVG로 교체 */
function setPersonalIcons(){

  if(pin) pin.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s6-5.2 6-11a6 6 0 1 0-12 0c0 5.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></svg>';
  if(person) person.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7.5" r="3.2"/><path d="M5.5 20c.8-4 3-6 6.5-6s5.7 2 6.5 6"/></svg>';
}
setPersonalIcons();

/* 시청 횟수에 감소 버튼도 추가 */
function ensureViewControls(){
  var row=document.querySelector('#moviePersonalScreen .viewCountRow');
  var btn=document.getElementById('movieViewCount');
  if(row&&btn&&!row.querySelector('.viewCountControl')){
    var wrap=document.createElement('span'); wrap.className='viewCountControl';
    btn.parentNode.insertBefore(wrap,btn); wrap.appendChild(btn);
    var minus=document.createElement('button'); minus.className='countAdjust'; minus.type='button';
    minus.textContent='−'; minus.setAttribute('aria-label','시청 횟수 줄이기');
    wrap.insertBefore(minus,btn);
    var plus=document.createElement('button'); plus.className='countAdjust'; plus.type='button';
    plus.textContent='+'; plus.setAttribute('aria-label','시청 횟수 늘리기'); wrap.appendChild(plus);
    minus.onclick=function(e){e.stopPropagation();var n=Math.max(1,(Number(btn.textContent)||1)-1);btn.textContent=String(n)};
    plus.onclick=function(e){e.stopPropagation();var n=(Number(btn.textContent)||1)+1;btn.textContent=String(n)};
    btn.onclick=function(e){e.stopPropagation()};
  }
}
ensureViewControls();
new MutationObserver(ensureViewControls).observe(document.getElementById('moviePersonalScreen'),{childList:true,subtree:true});

/* 상세 화면의 시청 횟수도 감소/증가 가능 */
var detailObserver=new MutationObserver(function(){
  var b=document.getElementById('detailCountButton');
  if(!b||b.dataset.controlReady)return;
  b.dataset.controlReady='1';
  var parent=b.parentElement, wrap=document.createElement('span'); wrap.className='detailCountControl';

  wrap.insertBefore(minus,b);wrap.appendChild(plus);
  minus.onclick=function(e){
    e.stopPropagation();var arr=JSON.parse(localStorage.getItem('mongul_movies')||'[]');
    var title=(document.getElementById('movieDetail')||{}).querySelector?.('.detailMovieTitle')?.textContent||'';
    var idx=arr.findIndex(function(x){return x.title===title});
    if(idx<0)return;
    arr[idx].viewCount=Math.max(1,(Number(arr[idx].viewCount)||1)-1);b.textContent=arr[idx].viewCount+'회';localStorage.setItem('mongul_movies',JSON.stringify(arr));
  };
  plus.onclick=function(e){
    e.stopPropagation();var arr=JSON.parse(localStorage.getItem('mongul_movies')||'[]');
    var title=(document.getElementById('movieDetail')||{}).querySelector?.('.detailMovieTitle')?.textContent||'';
    var idx=arr.findIndex(function(x){return x.title===title});
    if(idx<0)return;
    arr[idx].viewCount=(Number(arr[idx].viewCount)||1)+1;b.textContent=arr[idx].viewCount+'회';localStorage.setItem('mongul_movies',JSON.stringify(arr));
  };
});
detailObserver.observe(document.getElementById('movieDetail'),{childList:true,subtree:true});

/* 효과음을 가볍고 짧은 연필 사각거림으로 교체 */
var mongulEffectCtx=null;
window.playEffect=function(){
  if(localStorage.getItem('mongul_effect')!=='1')return;
  try{
    if(!mongulEffectCtx) mongulEffectCtx=new(window.AudioContext||window.webkitAudioContext)();
    var ctx=mongulEffectCtx;
    var start=function(){
      var t=ctx.currentTime;
      var buffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*.055),ctx.sampleRate);
      var data=buffer.getChannelData(0);
      for(var i=0;i<data.length;i++){
        var env=1-i/data.length;
        data[i]=(Math.random()*2-1)*env*env*.22;
      }
      var src=ctx.createBufferSource(), hp=ctx.createBiquadFilter(), gain=ctx.createGain();
      hp.type='highpass';hp.frequency.value=1400;hp.Q.value=.45;
      gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.12,t+.006);
      gain.gain.exponentialRampToValueAtTime(.0001,t+.045);
      src.buffer=buffer;src.connect(hp).connect(gain).connect(ctx.destination);src.start(t);
      /* 아주 짧은 두 번의 마찰감 = 가벼운 연필 사각 소리 */
      setTimeout(function(){
        try{
          var t2=ctx.currentTime, s2=ctx.createBufferSource(), g2=ctx.createGain();
          s2.buffer=buffer;g2.gain.value=.045;s2.connect(hp).connect(g2).connect(ctx.destination);s2.start(t2);
        }catch(e){}
      },22);
    };
    if(ctx.state==='suspended')ctx.resume().then(start).catch(function(){});
    else start();
  }catch(e){}
};

/* 달력 팝업: 같은 날짜를 한 번 더 누르면 닫힘. 날짜 선택 후 자동으로 닫지 않음. */
window.openThemedDatePicker=function(){
  var input=document.getElementById('movieDateOnly');
  var cur=input.dataset.date||localToday();
  var d=new Date(cur+'T00:00:00'), y=d.getFullYear(), m=d.getMonth(), selected=cur;
  var ov=document.createElement('div');ov.className='datePickerOverlay';
  ov.innerHTML='<div class="datePickerCard"><div class="datePickerHead"><button class="dpPrev">‹</button><div class="dpTitle"></div><button class="dpNext">›</button></div><div class="dateWeek"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="dateGrid"></div></div>';
  document.body.appendChild(ov);
  function close(){ov.remove()}
  function localKey(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
  function localToday(){var q=new Date();return localKey(q.getFullYear(),q.getMonth(),q.getDate())}
  function draw(){
    var names=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
    ov.querySelector('.dpTitle').textContent=y+'년 '+names[m];
    var first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),h='';
    for(var i=0;i<first;i++)h+='<span></span>';
    for(var day=1;day<=last;day++){
      var k=localKey(y,m,day);
      h+='<button type="button" class="dateCell '+(k===selected?'selected':'')+'" data-date="'+k+'">'+day+'</button>';
    }
    ov.querySelector('.dateGrid').innerHTML=h;
    ov.querySelectorAll('.dateCell').forEach(function(b){
      b.onclick=function(e){
        e.stopPropagation();
        var k=b.dataset.date;
        if(k===selected){ input.dataset.date=k;input.textContent=k;close();return; }
        selected=k; input.dataset.date=k; input.textContent=k; draw();
      };
    });
  }
  ov.querySelector('.dpPrev').onclick=function(){m--;if(m<0){m=11;y--}draw()};
  ov.querySelector('.dpNext').onclick=function(){m++;if(m>11){m=0;y++}draw()};
  ov.addEventListener('click',function(e){if(e.target===ov)close()});
  draw();
};
var dateBtn=document.getElementById('movieDateOnly');
if(dateBtn)dateBtn.onclick=function(e){e.stopPropagation();window.openThemedDatePicker()};

/* 홈 달력: 오른쪽→왼쪽 스와이프 = 일기 목록 */
var cal=document.getElementById('calendarScreen'), sx=0,sy=0;

<script>
(function(){
  /* 별점 렌더링은 기존 클릭/반점수 기능을 그대로 유지하면서 색상만 사진처럼 교체 */
  var originalRenderRating = window.renderRating;
  function repaintStars(){
    var box=document.getElementById('rateBtns');
    if(!box)return;
    var stars=box.querySelectorAll('.bigStar');
    stars.forEach(function(btn){
      var path=btn.querySelector('path');
      if(!path)return;
      btn.style.color='#000';
      if(btn.classList.contains('off')){
        path.setAttribute('fill','none');
        path.setAttribute('stroke','#d3d3d3');
      }else if(btn.classList.contains('half')){
        path.setAttribute('fill','#000');
        path.setAttribute('stroke','#000');
      }else{
        path.setAttribute('fill','#000');
        path.setAttribute('stroke','#000');
      }
    });
  }
  var rateBox=document.getElementById('rateBtns');
  if(rateBox){
    new MutationObserver(repaintStars).observe(rateBox,{childList:true,subtree:true});
    setTimeout(repaintStars,0);
  }

  /* 날짜를 2026년 10월 5일 월요일 형식으로 표시 */
  function localKey(y,m,d){
    return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }
  function todayKey(){
    var d=new Date();
    return localKey(d.getFullYear(),d.getMonth(),d.getDate());
  }
  function parseKey(k){
    var p=String(k||todayKey()).split('-').map(Number);
    var d=new Date(p[0],(p[1]||1)-1,p[2]||1);
    return {y:d.getFullYear(),m:d.getMonth(),day:d.getDate()};
  }
  function dateText(k){
    var d=parseKey(k);
    var w=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
    return d.y+'년 '+(d.m+1)+'월 '+d.day+'일 '+w[new Date(d.y,d.m,d.day).getDay()];
  }
  function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}

  var dateBtn=document.getElementById('movieDateOnly');
  if(!dateBtn)return;

  function syncDateText(){
    var k=dateBtn.dataset.date||todayKey();
    dateBtn.dataset.date=k;
    dateBtn.textContent=dateText(k);
  }

  /* 영화 기록 화면이 열릴 때마다 날짜 표시를 사진처럼 맞춤 */
  var personal=document.getElementById('moviePersonalScreen');
  if(personal){
    new MutationObserver(function(){
      if(personal.classList.contains('active'))setTimeout(syncDateText,0);
    }).observe(personal,{attributes:true,attributeFilter:['class']});
  }
  syncDateText();

  function openWheel(){
    if(document.querySelector('.mongulWheelOverlay'))return;
    var selected=parseKey(dateBtn.dataset.date||todayKey());
    var ov=document.createElement('div');
    ov.className='mongulWheelOverlay';
    ov.innerHTML=
      '<div class="mongulWheelCard">'+
        '<div class="mongulWheelTitle">날짜 선택</div>'+
        '<div class="mongulWheels">'+
          '<div class="mongulWheel" data-kind="year"></div>'+
          '<div class="mongulWheel" data-kind="month"></div>'+
          '<div class="mongulWheel" data-kind="day"></div>'+
        '</div>'+
      '</div>';
    document.body.appendChild(ov);

    var yearWheel=ov.querySelector('[data-kind="year"]');
    var monthWheel=ov.querySelector('[data-kind="month"]');
    var dayWheel=ov.querySelector('[data-kind="day"]');
    var years=[];
    for(var y=1950;y<=2100;y++)years.push(y);

    function renderWheel(wheel,items,current,suffix){
      var h='<div class="mongulWheelSpacer"></div>';
      items.forEach(function(v){
        h+='<div class="mongulWheelItem'+(v===current?' selected':'')+'" data-value="'+v+'">'+v+suffix+'</div>';
      });
      h+='<div class="mongulWheelSpacer"></div>';
      wheel.innerHTML=h;
    }
    function centerOn(wheel,index,instant){
      var target=wheel.querySelectorAll('.mongulWheelItem')[index];
      if(!target)return;
      wheel.scrollTo({top:target.offsetTop-76,behavior:instant?'auto':'smooth'});
    }
    function rebuildDays(instant){
      var max=daysInMonth(selected.y,selected.m);
      if(selected.day>max)selected.day=max;
      renderWheel(dayWheel,Array.from({length:max},function(_,i){return i+1}),selected.day,'일');
      centerOn(dayWheel,selected.day-1,true);
    }
    function rebuildAll(instant){
      renderWheel(yearWheel,years,selected.y,'년');
      renderWheel(monthWheel,Array.from({length:12},function(_,i){return i+1}),selected.m+1,'월');
      rebuildDays(true);
      centerOn(yearWheel,selected.y-1950,true);
      centerOn(monthWheel,selected.m,true);
    }
    function updateFromWheel(wheel,kind){
      var items=wheel.querySelectorAll('.mongulWheelItem');
      if(!items.length)return;
      var center=wheel.scrollTop+95;
      var best=0,bestDist=Infinity;
      items.forEach(function(item,i){
        var d=Math.abs((item.offsetTop+19)-center);
        if(d<bestDist){bestDist=d;best=i}
      });
      var val=Number(items[best].dataset.value);
      if(kind==='year')selected.y=val;
      if(kind==='month')selected.m=val-1;
      if(kind==='day')selected.day=val;
      if(kind!=='day')rebuildDays(true);
      dateBtn.dataset.date=localKey(selected.y,selected.m,selected.day);
      syncDateText();
      items.forEach(function(item,i){item.classList.toggle('selected',i===best)});
    }
    function bindWheel(wheel,kind){
      var timer;
      wheel.addEventListener('scroll',function(){
        clearTimeout(timer);
        timer=setTimeout(function(){updateFromWheel(wheel,kind)},100);
      },{passive:true});
      wheel.addEventListener('click',function(e){
        var item=e.target.closest('.mongulWheelItem');
        if(!item)return;
        var items=[].slice.call(wheel.querySelectorAll('.mongulWheelItem'));
        var idx=items.indexOf(item);
        centerOn(wheel,idx,false);
      });
    }
    bindWheel(yearWheel,'year');
    bindWheel(monthWheel,'month');
    bindWheel(dayWheel,'day');
    rebuildAll(true);

    /* 날짜 표시를 다시 누르면 닫힘 */
    ov.addEventListener('click',function(e){
      if(e.target===ov)ov.remove();
    });
  }

  window.openMongulDateWheel=openWheel;

  dateBtn.onclick=function(e){
    e.stopPropagation();
    var existing=document.querySelector('.mongulWheelOverlay');
    if(existing){existing.remove();return}
    syncDateText();
    openWheel();
  };

  /* 롤러에서 선택한 값이 실제 저장 날짜와 동일하도록 보정 */
  var saveMovieButton=document.getElementById('saveMovie');
  if(saveMovieButton)saveMovieButton.addEventListener('click',function(){
    syncDateText();
  },true);
})();
</script>

      var dy=e.changedTouches[0].clientY-touchY;
      if(Math.abs(dx)<70||Math.abs(dx)<=Math.abs(dy))return;
      /* 기존 왼쪽→오른쪽/오른쪽→왼쪽 처리와 충돌하지 않도록 모두 차단 */
      e.preventDefault();
      e.stopImmediatePropagation();
      if(dx>0){
        var menu=document.getElementById('diaryMenu');
        if(menu)menu.click();
      }
    },{passive:false,capture:true});
  }
})();
</script>
