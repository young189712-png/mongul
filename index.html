<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf7">
<title>몽글</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fffaf7;color:#554b47}body{font-family:Gaegu,"Apple SD Gothic Neo",sans-serif;font-size:18px;-webkit-tap-highlight-color:transparent}button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:active{transform:scale(.98)}
#app{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:#fffdfb;overflow:hidden}.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #eee5e0;position:sticky;top:0;z-index:10;background:#fffdfb}.logo{font-size:30px;font-weight:700}.icon{width:44px;height:44px;font-size:29px;display:grid;place-items:center}.icon:active{background:#f7efeb;border-radius:50%}
main{padding:16px}.screen{display:none;min-height:calc(100vh - 80px)}.screen.active{display:block}.pageTitle{font-size:30px;font-weight:700;margin:8px 0 18px}.back{font-size:36px;padding:0 6px;margin:-4px 0 5px}.sub{color:#9b8d86;font-size:17px}
.month{display:flex;align-items:center;justify-content:space-between;text-align:center;margin:8px 0 18px}.month .year{font-size:20px}.month .mon{font-size:32px;font-weight:700}.arrow{font-size:37px;width:46px;height:46px}.calendarWrap{touch-action:pan-y}.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:#9a8e88;margin-bottom:7px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;transition:transform .18s ease,opacity .18s ease}.calendar.slideUp{transform:translateY(-18px);opacity:.35}.calendar.slideDown{transform:translateY(18px);opacity:.35}.blank{height:62px}.day{height:62px;border-radius:14px;background:#fff;border:1px solid transparent;font-size:18px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.day.today{background:#fff0e9}.day.has{border-color:#f0e3dd}.dayNum{line-height:1}.sticker{font-size:21px;margin-top:5px;line-height:1}
.fab{position:fixed;z-index:20;right:max(20px,calc((100vw - 430px)/2 + 18px));bottom:22px;width:58px;height:58px;border-radius:50%;background:#66564e;color:#fff;font-size:34px;box-shadow:0 5px 15px #0002}.menuList{display:flex;flex-direction:column;gap:9px}.menuBtn{width:100%;padding:18px 16px;border:1px solid #eee2dc;border-radius:16px;background:#fff;text-align:left;font-size:22px}.menuBtn span{margin-right:8px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mood{padding:15px 5px;border:1px solid #eee2dc;border-radius:17px;background:#fff;font-size:18px}.mood b{display:block;font-size:38px;margin-bottom:4px}.chosen{font-size:48px;margin:4px 0 7px}.field{width:100%;padding:13px 14px;margin:5px 0;border:1px solid #e6d9d2;border-radius:14px;background:#fff;outline:none}.field:focus{border-color:#c9b7ae}.area{min-height:220px;resize:none}.primary{width:100%;padding:14px;border-radius:14px;background:#66564e;color:#fff;font-size:20px;margin-top:8px}.secondary{width:100%;padding:13px;border:1px solid #e5d9d3;border-radius:14px;background:#fff;font-size:19px;margin-top:8px}
.list{display:flex;flex-direction:column;gap:9px}.item{width:100%;display:flex;gap:12px;align-items:center;padding:13px;border:1px solid #eee2dc;border-radius:16px;background:#fff;text-align:left}.grow{flex:1;min-width:0}.itemTitle{font-size:22px;font-weight:700}.itemMeta{margin-top:3px;color:#9a8d86}.empty{text-align:center;color:#aaa;padding:55px 10px}.topRow{display:flex;align-items:center;justify-content:space-between}.plus{width:44px;height:44px;border-radius:50%;font-size:30px}.plus:active{background:#f4ece8}
.poster{width:62px;height:86px;object-fit:cover;border-radius:9px;background:#f0e7e2;flex:none}.poster.big{width:105px;height:145px}.movieCard{display:flex;gap:14px;padding:14px;border:1px solid #eee2dc;border-radius:17px;background:#fff}.movieCard h2{font-size:27px;margin:0 0 5px}.stars{font-family:Arial,sans-serif;font-size:20px;letter-spacing:1px}.movieSearchRow{display:flex;gap:7px}.movieSearchRow .field{margin:0}.searchBtn{width:74px;border-radius:14px;background:#66564e;color:#fff;font-size:18px}.result{width:100%;display:flex;gap:12px;align-items:center;padding:12px;margin-top:8px;border:1px solid #eee2dc;border-radius:15px;background:#fff;text-align:left}.result img{width:54px;height:76px;object-fit:cover;border-radius:7px;background:#f0e7e2}.naver{display:inline-block;margin-top:7px;color:#4b7c57;text-decoration:none}.infoBox{padding:14px;border-radius:16px;background:#fff;border:1px solid #eee2dc;margin-top:10px}.infoLine{padding:8px 0;border-bottom:1px solid #f1e8e4}.infoLine:last-child{border-bottom:0}.rateBtns{display:flex;gap:3px;margin:7px 0}.rateBtn{font-family:Arial,sans-serif;font-size:27px;padding:1px 3px}.notice{padding:12px;border-radius:13px;background:#faf3ef;color:#8f817a;font-size:16px;margin:8px 0}
@media(max-width:360px){main{padding:12px}.day{height:56px}.blank{height:56px}.mood{font-size:16px}.logo{font-size:28px}}
</style>
</head>
<body>
<div id="app">
<header class="top">
<button id="homeBtn" class="icon" aria-label="메뉴">⌂</button><div class="logo">몽글</div><button id="todayBtn" class="icon" aria-label="오늘">♡</button>
</header>
<main>
<section id="calendarScreen" class="screen active">
<div class="month"><button id="prevMonth" class="arrow">‹</button><div><div id="year" class="year"></div><div id="month" class="mon"></div></div><button id="nextMonth" class="arrow">›</button></div>
<div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div id="calendarWrap" class="calendarWrap"><div id="calendar" class="calendar"></div></div>
<button id="addBtn" class="fab">＋</button>
</section>
<section id="menuScreen" class="screen"><div class="pageTitle">몽글 메뉴</div><div class="menuList"><button id="diaryMenu" class="menuBtn"><span>📖</span>일기 목록</button><button id="movieMenu" class="menuBtn"><span>🎬</span>영화 목록</button></div></section>
<section id="diaryListScreen" class="screen"><button class="back" data-calendar>‹</button><div class="pageTitle">일기 목록</div><div id="diaryList" class="list"></div></section>
<section id="moodScreen" class="screen"><button class="back" data-calendar>‹</button><div id="moodDate" class="sub"></div><div class="pageTitle">오늘의 감정을<br>골라보세요</div><div id="moods" class="moods"></div></section>
<section id="writeScreen" class="screen"><button class="back" data-calendar>‹</button><div id="writeDate" class="sub"></div><div id="chosenMood" class="chosen"></div><input id="diaryTitle" class="field" placeholder="오늘은 어떤 하루였나요?"><textarea id="diaryBody" class="field area" placeholder="천천히 적어보세요.&#10;&#10;오늘 있었던 일, 생각, 고마웠던 순간까지..." ></textarea><button id="saveDiary" class="primary">기록하기</button></section>
<section id="diaryDetailScreen" class="screen"><button class="back" data-calendar>‹</button><div id="diaryDetail"></div></section>
<section id="movieListScreen" class="screen"><button class="back" data-calendar>‹</button><div class="topRow"><div class="pageTitle">영화 목록</div><button id="moviePlus" class="plus">＋</button></div><div id="movieList" class="list"></div></section>
<section id="movieSearchScreen" class="screen"><button class="back" data-movies>‹</button><div class="pageTitle">영화 찾기</div><div class="movieSearchRow"><input id="movieQuery" class="field" placeholder="영화 제목을 입력해보세요"><button id="movieSearchBtn" class="searchBtn">검색</button></div><div class="notice">검색 결과에서 영화를 고르면 기록 화면으로 넘어가요.</div><div id="movieResults"></div></section>
<section id="movieWriteScreen" class="screen"><button class="back" data-movies>‹</button><div id="movieChosen"></div><div class="infoBox"><div>내 평점</div><div id="rateBtns" class="rateBtns"></div></div><input id="movieYear" class="field" placeholder="개봉연도"><input id="movieDirector" class="field" placeholder="감독"><input id="movieActors" class="field" placeholder="주연 배우"><input id="movieDate" class="field" type="date"><input id="moviePlace" class="field" placeholder="어디서 봤나요?"><input id="movieWho" class="field" placeholder="누구와 봤나요?"><textarea id="movieReview" class="field area" placeholder="영화 감상을 적어보세요."></textarea><button id="saveMovie" class="primary">영화 기록하기</button></section>
<section id="movieDetailScreen" class="screen"><button class="back" data-movies>‹</button><div id="movieDetail"></div></section>
</main>
</div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var view=new Date();
var diaries=read('mongul_diaries');
var movies=read('mongul_movies');
var selectedDate='';
var selectedMood='';
var selectedMovie=null;
var rating=0;
function read(k){try{var x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch(e){return []}}
function save(){localStorage.setItem('mongul_diaries',JSON.stringify(diaries));localStorage.setItem('mongul_movies',JSON.stringify(movies))}
function pad(n){return String(n).padStart(2,'0')}
function dateKey(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
function todayKey(){var d=new Date();return dateKey(d.getFullYear(),d.getMonth(),d.getDate())}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});$(id).classList.add('active');window.scrollTo(0,0)}
function renderCalendar(){var y=view.getFullYear(),m=view.getMonth();$('year').textContent=y+'년';$('month').textContent=(m+1)+'월';var first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate(),html='';for(var i=0;i<first;i++)html+='<div class="blank"></div>';for(var d=1;d<=last;d++){var k=dateKey(y,m,d),e=diaries.find(function(x){return x.date===k});html+='<button class="day '+(k===todayKey()?'today ':'')+(e?'has':'')+'" data-date="'+k+'"><span class="dayNum">'+d+'</span>'+(e?'<span class="sticker">'+esc(e.mood)+'</span>':'')+'</button>'}$('calendar').innerHTML=html;document.querySelectorAll('.day').forEach(function(b){b.onclick=function(){openDate(b.dataset.date)}})}
function monthMove(delta){var cal=$('calendar');cal.classList.remove('slideUp','slideDown');void cal.offsetWidth;cal.classList.add(delta<0?'slideDown':'slideUp');setTimeout(function(){view.setMonth(view.getMonth()+delta);renderCalendar();cal.classList.remove('slideUp','slideDown')},130)}
function openDate(k){selectedDate=k;var e=diaries.find(function(x){return x.date===k});if(e){showDiaryDetail(e);return}$('moodDate').textContent=k;renderMoods();show('moodScreen')}
function renderMoods(){var arr=[['😊','기분 좋아요'],['🥰','행복해요'],['😌','편안해요'],['😢','슬퍼요'],['😣','힘들어요'],['😡','화나요'],['😳','놀랐어요'],['🥺','아쉬워요'],['🤍','그냥 그래요']];$('moods').innerHTML=arr.map(function(x){return '<button class="mood" data-mood="'+x[0]+'"><b>'+x[0]+'</b>'+x[1]+'</button>'}).join('');document.querySelectorAll('.mood').forEach(function(b){b.onclick=function(){selectedMood=b.dataset.mood;$('chosenMood').textContent=selectedMood;$('writeDate').textContent=selectedDate;$('diaryTitle').value='';$('diaryBody').value='';show('writeScreen')}})}
function renderDiaryList(){if(!diaries.length){$('diaryList').innerHTML='<div class="empty">아직 기록한 일기가 없어요.</div>';return}var arr=diaries.slice().sort(function(a,b){return String(b.date).localeCompare(String(a.date))});$('diaryList').innerHTML=arr.map(function(e){return '<button class="item" data-date="'+esc(e.date)+'"><div style="font-size:35px">'+esc(e.mood)+'</div><div class="grow"><div class="itemTitle">'+esc(e.title||'제목 없는 하루')+'</div><div class="itemMeta">'+esc(e.date)+'</div></div></button>'}).join('');document.querySelectorAll('#diaryList .item').forEach(function(b){b.onclick=function(){var e=diaries.find(function(x){return x.date===b.dataset.date});showDiaryDetail(e)}})}
function showDiaryDetail(e){if(!e)return;$('diaryDetail').innerHTML='<div class="sub">'+esc(e.date)+'</div><div style="font-size:48px;margin-top:8px">'+esc(e.mood)+'</div><div class="pageTitle">'+esc(e.title||'오늘의 기록')+'</div><div class="infoBox" style="white-space:pre-wrap;line-height:1.7">'+esc(e.body||'')+'</div>';show('diaryDetailScreen')}
function renderMovies(){if(!movies.length){$('movieList').innerHTML='<div class="empty">아직 기록한 영화가 없어요.<br>오른쪽 위 ＋를 눌러 기록해보세요.</div>';return}var arr=movies.slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''))});$('movieList').innerHTML=arr.map(function(e,i){var stars='★'.repeat(Number(e.rating)||0)+'☆'.repeat(5-(Number(e.rating)||0));return '<button class="item" data-index="'+movies.indexOf(e)+'"><img class="poster" src="'+esc(e.poster||'')+'" onerror="this.style.visibility=\'hidden\'"><div class="grow"><div class="itemTitle">'+esc(e.title)+'</div><div class="stars">'+stars+'</div><div class="itemMeta">'+esc(e.year||'')+'</div></div></button>'}).join('');document.querySelectorAll('#movieList .item').forEach(function(b){b.onclick=function(){showMovieDetail(movies[Number(b.dataset.index)])}})}
function showMovieDetail(e){if(!e)return;var stars='★'.repeat(Number(e.rating)||0)+'☆'.repeat(5-(Number(e.rating)||0));$('movieDetail').innerHTML='<div class="movieCard"><img class="poster big" src="'+esc(e.poster||'')+'" onerror="this.style.visibility=\'hidden\'"><div class="grow"><h2>'+esc(e.title)+'</h2><div class="stars">'+stars+'</div></div></div><div class="infoBox"><div class="infoLine"><b>개봉연도</b> '+esc(e.year||'-')+'</div><div class="infoLine"><b>감독</b> '+esc(e.director||'-')+'</div><div class="infoLine"><b>배우</b> '+esc(e.actors||'-')+'</div><div class="infoLine"><b>본 날짜</b> '+esc(e.date||'-')+'</div><div class="infoLine"><b>장소</b> '+esc(e.place||'-')+'</div><div class="infoLine"><b>함께</b> '+esc(e.who||'-')+'</div><div class="infoLine"><b>감상</b><br><span style="white-space:pre-wrap">'+esc(e.review||'-')+'</span></div></div>';show('movieDetailScreen')}
function resetMovieForm(){selectedMovie=null;rating=0;$('movieYear').value='';$('movieDirector').value='';$('movieActors').value='';$('movieDate').value=todayKey();$('moviePlace').value='';$('movieWho').value='';$('movieReview').value='';$('movieChosen').innerHTML='';renderRatings()}
function renderRatings(){var h='';for(var i=1;i<=5;i++)h+='<button class="rateBtn" data-rate="'+i+'">'+(i<=rating?'★':'☆')+'</button>';$('rateBtns').innerHTML=h;document.querySelectorAll('.rateBtn').forEach(function(b){b.onclick=function(){rating=Number(b.dataset.rate);renderRatings()}})}
function chooseMovie(title,poster){selectedMovie={title:title,poster:poster||''};$('movieChosen').innerHTML='<div class="movieCard"><img class="poster big" src="'+esc(selectedMovie.poster)+'" onerror="this.style.visibility=\'hidden\'"><div class="grow"><h2>'+esc(selectedMovie.title)+'</h2><a class="naver" target="_blank" rel="noopener" href="https://search.naver.com/search.naver?query='+encodeURIComponent(selectedMovie.title+' 영화')+'">네이버에서 자세히 보기</a></div></div>';renderRatings();show('movieWriteScreen')}
async function searchMovies(){var q=$('movieQuery').value.trim();if(!q){$('movieResults').innerHTML='<div class="empty">영화 제목을 입력해주세요.</div>';return}$('movieResults').innerHTML='<div class="empty">찾는 중...</div>';try{var url='https://ko.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q+' 영화')+'&gsrlimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=200&format=json&origin=*';var data=await fetch(url).then(function(r){return r.json()});var pages=Object.values(data.query&&data.query.pages||{});pages=pages.filter(function(p){return p&&p.title});$('movieResults').innerHTML=pages.length?pages.map(function(p){var img=p.thumbnail&&p.thumbnail.source||'';return '<button class="result" data-title="'+esc(p.title)+'" data-img="'+esc(img)+'"><img src="'+esc(img)+'" onerror="this.style.visibility=\'hidden\'"><div class="grow"><div class="itemTitle">'+esc(p.title)+'</div><div class="itemMeta">영화 기록하기 · 네이버 연결 가능</div></div></button>'}).join(''):'<div class="empty">검색 결과가 없어요.</div>';document.querySelectorAll('.result').forEach(function(b){b.onclick=function(){chooseMovie(b.dataset.title,b.dataset.img)}})}catch(e){$('movieResults').innerHTML='<div class="empty">검색을 불러오지 못했어요.<br>인터넷 연결을 확인해주세요.</div>'}}
$('prevMonth').onclick=function(){monthMove(-1)};$('nextMonth').onclick=function(){monthMove(1)};
$('homeBtn').onclick=function(){show('menuScreen')};$('todayBtn').onclick=function(){view=new Date();renderCalendar();show('calendarScreen')};$('addBtn').onclick=function(){openDate(todayKey())};
$('diaryMenu').onclick=function(){renderDiaryList();show('diaryListScreen')};$('movieMenu').onclick=function(){renderMovies();show('movieListScreen')};$('moviePlus').onclick=function(){resetMovieForm();show('movieSearchScreen')};$('movieSearchBtn').onclick=searchMovies;$('movieQuery').onkeydown=function(e){if(e.key==='Enter')searchMovies()};
$('saveDiary').onclick=function(){if(!selectedMood)return;diaries=diaries.filter(function(x){return x.date!==selectedDate});diaries.push({date:selectedDate,mood:selectedMood,title:$('diaryTitle').value.trim(),body:$('diaryBody').value});save();renderCalendar();show('calendarScreen')};
$('saveMovie').onclick=function(){if(!selectedMovie)return;movies.push({title:selectedMovie.title,poster:selectedMovie.poster,year:$('movieYear').value.trim(),director:$('movieDirector').value.trim(),actors:$('movieActors').value.trim(),date:$('movieDate').value,place:$('moviePlace').value.trim(),who:$('movieWho').value.trim(),review:$('movieReview').value,rating:rating});save();renderMovies();show('movieListScreen')};
document.querySelectorAll('[data-calendar]').forEach(function(b){b.onclick=function(){show('calendarScreen')}});document.querySelectorAll('[data-movies]').forEach(function(b){b.onclick=function(){renderMovies();show('movieListScreen')}});
var sx=0,sy=0;document.addEventListener('touchstart',function(e){if(!$('calendarScreen').classList.contains('active'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',function(e){if(!$('calendarScreen').classList.contains('active'))return;var ex=e.changedTouches[0].clientX,ey=e.changedTouches[0].clientY,dx=ex-sx,dy=ey-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){if(dx>0){renderDiaryList();show('diaryListScreen')}}else if(Math.abs(dy)>55&&Math.abs(dy)>Math.abs(dx)){monthMove(dy<0?1:-1)}},{passive:true});
// 오래된 서비스워커가 이전 화면을 계속 보여주는 문제 방지
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})});if(window.caches){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}}
renderCalendar();
})();
</script>
</body>
</html>
