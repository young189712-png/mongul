<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdfb">
<title>몽글</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fffdfb;color:#292625}body{font-family:Gaegu,"Apple SD Gothic Neo",sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent}button,input,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:active{transform:scale(.985)}
#app{width:100%;max-width:430px;min-height:100vh;margin:auto;background:#fffdfb;overflow-x:hidden}.screen{display:none;min-height:100vh;padding:28px 20px 90px}.screen.active{display:block}.topbar{height:70px;padding:12px 17px 0;display:flex;align-items:center;justify-content:space-between;background:#fffdfb}.topbtn{width:42px;height:42px;font-size:31px;display:grid;place-items:center}.topbtn:active{background:#f5f1ee;border-radius:50%}.brand{font-size:24px;font-weight:700;opacity:.9}
.calendarScreen{padding-top:0}.calhead{display:flex;align-items:center;justify-content:space-between;text-align:center;padding:22px 0 14px}.calyear{font-size:20px}.calmonth{font-size:34px;line-height:1.05;letter-spacing:.5px}.calarrow{font-size:37px;width:44px;height:44px}.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:#b2aaa6;font-size:15px;margin:5px 0 7px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;transition:.18s ease}.calendar.slideUp{transform:translateY(-15px);opacity:.3}.calendar.slideDown{transform:translateY(15px);opacity:.3}.blank,.day{height:63px}.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;border-radius:14px;font-size:18px}.dayNum{line-height:1}.day.sun .dayNum{color:#f0a6a0}.day.sat .dayNum{color:#a8c0e9}.day.today{background:#fff3ee}.sticker{font-size:24px;line-height:1;margin-top:4px}.fab{position:fixed;z-index:20;right:max(20px,calc((100vw - 430px)/2 + 18px));bottom:22px;width:70px;height:70px;border-radius:25px;background:#fff;box-shadow:0 5px 20px #00000012;font-size:38px}
.page{padding-top:8px}.pageHead{display:flex;align-items:center;justify-content:space-between;margin:0 0 22px}.pageHead .title{font-size:28px;font-weight:700}.back{font-size:37px;width:44px;height:44px}.menuPanel{position:fixed;z-index:50;top:70px;left:calc(50% - 195px);width:190px;background:#fff;border:1px solid #eee9e5;border-radius:16px;box-shadow:0 10px 28px #00000012;padding:8px}.menuPanel button{display:block;width:100%;padding:10px 13px;text-align:left;font-size:20px;border-radius:11px}.menuPanel button:active{background:#f7f3f0}.hidden{display:none!important}
/* diary */
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.mood{min-height:112px;border:1px solid #eee9e5;border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.moodIcon{width:58px;height:58px}.moodName{font-size:15px;color:#6f6864}.writeDate,.sub{color:#aaa39f;font-size:15px}.writeTitle{font-size:27px;margin:20px 0 12px}.field{width:100%;border:0;border-bottom:1px solid #e7e1dd;background:transparent;padding:12px 3px;outline:0;font-size:18px}.area{min-height:230px;resize:none;line-height:1.7;border:0;padding-top:16px}.primary{width:100%;margin-top:18px;padding:14px;border-radius:17px;background:#292625;color:#fff;font-size:19px}.diaryList{display:flex;flex-direction:column;gap:9px}.diaryItem{width:100%;display:flex;align-items:center;gap:12px;padding:13px;border-bottom:1px solid #eee9e5;text-align:left}.diaryItem .emoji{font-size:32px}.grow{flex:1;min-width:0}.diaryItemTitle{font-size:20px}.meta{font-size:14px;color:#aaa39f;margin-top:2px}.detailTitle{font-size:27px;margin:14px 0}.detailBody{white-space:pre-wrap;line-height:1.75;font-size:18px}.detailActions{display:flex;gap:8px;margin-top:24px}.outline{padding:10px 15px;border:1px solid #ddd6d1;border-radius:12px;font-size:16px}.pastelNote{font-size:14px;color:#aaa39f}
/* movies */
.movieGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 12px}.movieTile{text-align:left;min-width:0}.movieTile img{width:100%;aspect-ratio:2/3;display:block;object-fit:cover;background:#f1eeeb;border-radius:2px}.movieTitle{font-size:18px;line-height:1.2;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.movieStars{font-family:Arial,sans-serif;font-size:13px;letter-spacing:0;margin-top:4px}.movieStars .off{color:#d7d3d0}.plus{font-size:34px;width:45px;height:45px}.searchScreen{padding-top:15px}.searchTop{display:flex;align-items:center;gap:8px;margin-bottom:18px}.searchInput{font-size:20px;border:0;background:transparent;flex:1;outline:0;padding:9px 0}.searchInput::placeholder{color:#c5c3c1}.searchX{font-size:28px;color:#aaa}.searchResults{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px 12px}.searchTile{text-align:left}.searchTile img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#f1eeeb}.searchTile .movieTitle{white-space:normal;min-height:22px}.searchYear{font-size:14px;color:#aaa39f;margin-top:2px}.searchEmpty{text-align:center;color:#aaa39f;padding:80px 0}.searching{text-align:center;color:#aaa39f;padding:35px 0}
.rateScreen{text-align:center;padding-top:15px}.rateClose{position:absolute;left:18px;top:15px;font-size:33px}.selectedPoster{width:185px;aspect-ratio:2/3;object-fit:cover;background:#f1eeeb;margin:70px auto 16px;display:block}.selectedTitle{font-size:26px;margin-bottom:12px}.bigStars{display:flex;justify-content:center;gap:2px}.bigStar{font-family:Arial,sans-serif;font-size:44px;line-height:1;padding:2px;color:#1f1e1d}.bigStar.off{color:#ddd8d4}.nextBtn{position:fixed;right:max(24px,calc((100vw - 430px)/2 + 20px));bottom:28px;width:62px;height:62px;border-radius:22px;background:#fff;box-shadow:0 5px 20px #00000012;font-size:35px}.stepDots{text-align:center;color:#ddd;margin-top:45px}.stepDots b{color:#666}.autoInfo{margin:28px 0;border-top:1px dashed #ded8d4;border-bottom:1px dashed #ded8d4;padding:12px 0}.autoRow{display:flex;gap:18px;padding:10px 0;font-size:18px;line-height:1.45}.autoLabel{width:42px;color:#a6a09c;flex:none}.autoValue{flex:1}.personal{margin-top:25px}.personal .field{border-bottom:1px solid #e6e1de}.editMenu{position:fixed;z-index:60;right:18px;top:60px;background:#fff;border:1px solid #eee9e5;border-radius:13px;box-shadow:0 10px 25px #00000012;overflow:hidden}.editMenu button{display:block;padding:12px 18px;font-size:17px;width:100%;text-align:left}.editMenu button:active{background:#f6f2ef}.detailMovie{text-align:center}.detailMoviePoster{width:175px;aspect-ratio:2/3;object-fit:cover;background:#f1eeeb;margin:20px auto 14px}.detailMovieTitle{font-size:27px}.detailMovie .movieStars{font-size:18px;margin-top:7px}.detailInfo{margin-top:34px;text-align:left;border-top:1px dashed #ded8d4;padding-top:16px}.detailInfoRow{display:flex;gap:20px;padding:8px 0;font-size:17px;line-height:1.5}.detailInfoLabel{width:48px;color:#a6a09c;flex:none}.review{margin-top:20px;white-space:pre-wrap;line-height:1.75;font-size:18px}.dotsBtn{position:absolute;right:16px;top:15px;font-size:30px}
@media(max-width:360px){.screen{padding-left:16px;padding-right:16px}.movieGrid,.searchResults{gap:20px 9px}.movieTitle{font-size:16px}.day,.blank{height:58px}}
</style>
</head>
<body>
<div id="app">
<header class="topbar"><button id="homeBtn" class="topbtn" aria-label="메뉴">⌂</button><div class="brand">몽글</div><button id="todayBtn" class="topbtn" aria-label="오늘">♡</button></header>
<div id="menuPanel" class="menuPanel hidden"><button id="diaryMenu">일기</button><button id="movieMenu">영화</button></div>
<main>
<section id="calendarScreen" class="screen active calendarScreen"><div class="calhead"><button id="prevMonth" class="calarrow">‹</button><div><div id="year" class="calyear"></div><div id="month" class="calmonth"></div></div><button id="nextMonth" class="calarrow">›</button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar"></div><button id="addBtn" class="fab">＋</button></section>
<section id="diaryListScreen" class="screen page"><div class="pageHead"><button class="back" data-calendar>‹</button><div class="title">일기</div><div style="width:44px"></div></div><div id="diaryList" class="diaryList"></div></section>
<section id="moodScreen" class="screen page"><button class="back" data-calendar>‹</button><div id="moodDate" class="sub"></div><div class="writeTitle">오늘의 감정을<br>골라보세요</div><div id="moods" class="moods"></div></section>
<section id="writeScreen" class="screen page"><button class="back" data-calendar>‹</button><div id="writeDate" class="writeDate"></div><div id="chosenMood"></div><div class="writeTitle">오늘의 기록</div><input id="diaryTitle" class="field" placeholder="오늘은 어떤 하루였나요?"><textarea id="diaryBody" class="field area" placeholder="천천히 적어보세요."></textarea><button id="saveDiary" class="primary">기록하기</button></section>
<section id="diaryDetailScreen" class="screen page"><button class="back" data-calendar>‹</button><div id="diaryDetail"></div></section>
<section id="movieListScreen" class="screen page"><div class="pageHead"><button class="back" data-calendar>‹</button><div class="title">영화</div><button id="moviePlus" class="plus">＋</button></div><div id="movieList" class="movieGrid"></div></section>
<section id="movieSearchScreen" class="screen searchScreen"><div class="searchTop"><button class="back" data-movies>‹</button><input id="movieQuery" class="searchInput" placeholder="영화 검색" autocomplete="off"><button id="clearSearch" class="searchX">×</button></div><div id="movieResults" class="searchResults"></div></section>
<section id="movieRateScreen" class="screen rateScreen"><button id="rateClose" class="rateClose">×</button><img id="ratePoster" class="selectedPoster"><div id="rateTitle" class="selectedTitle"></div><div id="rateBtns" class="bigStars"></div><div class="stepDots"><b>●</b> ○ ○</div><button id="rateNext" class="nextBtn">→</button></section>
<section id="movieInfoScreen" class="screen page"><button class="back" data-movies>‹</button><div id="movieInfoTop"></div><div id="movieAutoInfo" class="autoInfo"></div><div class="stepDots">○ <b>●</b> ○</div><button id="infoNext" class="nextBtn">→</button></section>
<section id="moviePersonalScreen" class="screen page"><button class="back" data-movies>‹</button><div id="moviePersonalTop"></div><div class="personal"><input id="movieDate" class="field" type="date"><input id="moviePlace" class="field" placeholder="어디서 봤나요?"><input id="movieWho" class="field" placeholder="누구와 봤나요?"><textarea id="movieReview" class="field area" placeholder="영화 감상을 적어보세요."></textarea><button id="saveMovie" class="primary">영화 기록하기</button></div><div class="stepDots">○ ○ <b>●</b></div></section>
<section id="movieDetailScreen" class="screen page"><button class="back" data-movies>‹</button><button id="movieDetailMenuBtn" class="dotsBtn">⋮</button><div id="movieDetail"></div><div id="movieEditMenu" class="editMenu hidden"><button id="editMovie">수정하기</button><button id="deleteMovie">삭제하기</button></div></section>
</main></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);const qs=s=>document.querySelectorAll(s);
let view=new Date(), diaries=read('mongul_diaries'), movies=read('mongul_movies');
let selectedDate='',selectedMood='',editingDiary=null,selectedMovie=null,rating=0,editingMovieIndex=-1,movieResults=[];
function read(k){try{const x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch(e){return[]}}
function persist(){localStorage.setItem('mongul_diaries',JSON.stringify(diaries));localStorage.setItem('mongul_movies',JSON.stringify(movies))}
function pad(n){return String(n).padStart(2,'0')} function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)} function today(){const d=new Date();return key(d.getFullYear(),d.getMonth(),d.getDate())}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function show(id){qs('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0);$('menuPanel').classList.add('hidden')}
function stars(n,cls=''){n=Number(n)||0;return '<span class="'+cls+'">'+Array.from({length:5},(_,i)=>'<span class="'+(i<n?'':'off')+'">★</span>').join('')+'</span>'}
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth();$('year').textContent=y;$('month').textContent=(m+1)+'월';const first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();let h='';for(let i=0;i<first;i++)h+='<div class="blank"></div>';for(let d=1;d<=last;d++){const k=key(y,m,d),e=diaries.find(x=>x.date===k),dow=new Date(y,m,d).getDay();h+='<button class="day '+(dow===0?'sun ':'')+(dow===6?'sat ':'')+(k===today()?'today ':'')+'" data-date="'+k+'"><span class="dayNum">'+d+'</span>'+(e?'<span class="sticker">'+moodSvg(e.mood)+'</span>':'')+'</button>'}$('calendar').innerHTML=h;qs('.day').forEach(b=>b.onclick=()=>openDate(b.dataset.date))}
function monthMove(delta){const c=$('calendar');c.classList.remove('slideUp','slideDown');void c.offsetWidth;c.classList.add(delta<0?'slideDown':'slideUp');setTimeout(()=>{view.setMonth(view.getMonth()+delta);renderCalendar();c.classList.remove('slideUp','slideDown')},140)}
function moodSvg(type){const map={happy:['#FFD9D3','◡','• •'],love:['#FFD9E8','♡','• •'],calm:['#DCEEDB','⌣','• •'],sad:['#DDE8F7','︵','• •'],tired:['#E9E0F2','—','• •'],angry:['#FFD9C7','︿','• •'],surprised:['#FFF0BF','○','• •'],sorry:['#DDEFEA','︵','• •'],plain:['#E9E9E9','–','• •']};let k=type==='😊'?'happy':type==='🥰'?'love':type==='😌'?'calm':type==='😢'?'sad':type==='😣'?'tired':type==='😡'?'angry':type==='😳'?'surprised':type==='🥺'?'sorry':'plain';let [bg,mouth,eyes]=map[k];return '<svg class="moodIcon" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><circle cx="30" cy="30" r="27" fill="'+bg+'" stroke="#777" stroke-width="1.2" stroke-dasharray="2 2"/><text x="20" y="27" font-size="9" fill="#555">•</text><text x="37" y="27" font-size="9" fill="#555">•</text><text x="30" y="43" text-anchor="middle" font-size="18" fill="#555">'+mouth+'</text></svg>'}
function moodData(){return [['😊','좋아요'],['🥰','행복해요'],['😌','편안해요'],['😢','슬퍼요'],['😣','지쳤어요'],['😡','화나요'],['😳','놀랐어요'],['🥺','아쉬워요'],['🤍','그냥 그래요']]}
function renderMoods(){ $('moods').innerHTML=moodData().map(x=>'<button class="mood" data-mood="'+x[0]+'">'+moodSvg(x[0])+'<span class="moodName">'+x[1]+'</span></button>').join('');qs('.mood').forEach(b=>b.onclick=()=>{selectedMood=b.dataset.mood;$('chosenMood').innerHTML=moodSvg(selectedMood);$('writeDate').textContent=selectedDate;$('diaryTitle').value=editingDiary?.title||'';$('diaryBody').value=editingDiary?.body||'';show('writeScreen')})}
function openDate(k){selectedDate=k;editingDiary=diaries.find(x=>x.date===k)||null;if(editingDiary){showDiaryDetail(editingDiary)}else{$('moodDate').textContent=k;renderMoods();show('moodScreen')}}
function renderDiaryList(){const a=diaries.slice().sort((x,y)=>String(y.date).localeCompare(String(x.date)));$('diaryList').innerHTML=a.length?a.map(e=>'<button class="diaryItem" data-date="'+esc(e.date)+'"><div class="emoji">'+esc(e.mood)+'</div><div class="grow"><div class="diaryItemTitle">'+esc(e.title||'제목 없는 하루')+'</div><div class="meta">'+esc(e.date)+'</div></div></button>').join(''):'<div class="searchEmpty">아직 기록한 일기가 없어요.</div>';qs('#diaryList .diaryItem').forEach(b=>b.onclick=()=>showDiaryDetail(diaries.find(x=>x.date===b.dataset.date)))}
function showDiaryDetail(e){editingDiary=e;selectedDate=e.date;$('diaryDetail').innerHTML='<div class="sub">'+esc(e.date)+'</div><div style="margin-top:16px">'+moodSvg(e.mood)+'</div><div class="detailTitle">'+esc(e.title||'오늘의 기록')+'</div><div class="detailBody">'+esc(e.body||'')+'</div><div class="detailActions"><button id="editDiary" class="outline">수정하기</button><button id="deleteDiary" class="outline">삭제하기</button></div>';show('diaryDetailScreen');$('editDiary').onclick=()=>editDiary();$('deleteDiary').onclick=()=>{diaries=diaries.filter(x=>x!==e);persist();renderCalendar();renderDiaryList();show('diaryListScreen')}}
function editDiary(){if(!editingDiary)return;selectedDate=editingDiary.date;selectedMood=editingDiary.mood;renderMoods();$('moodDate').textContent=selectedDate;$('writeDate').textContent=selectedDate;$('chosenMood').innerHTML=moodSvg(selectedMood);$('diaryTitle').value=editingDiary.title||'';$('diaryBody').value=editingDiary.body||'';show('writeScreen')}
function renderMovies(){const a=movies.slice().sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));$('movieList').innerHTML=a.length?a.map((e)=>'<button class="movieTile" data-id="'+movies.indexOf(e)+'"><img src="'+esc(e.poster||'')+'" onerror="this.style.opacity=.15"><div class="movieTitle">'+esc(e.title)+'</div><div class="movieStars">'+stars(e.rating)+'</div></button>').join(''):'<div class="searchEmpty" style="grid-column:1/-1">아직 기록한 영화가 없어요.<br>＋에서 영화를 추가해보세요.</div>';qs('#movieList .movieTile').forEach(b=>b.onclick=()=>showMovieDetail(movies[Number(b.dataset.id)]))}
async function searchMovies(){const q=$('movieQuery').value.trim();if(!q){$('movieResults').innerHTML='';return}$('movieResults').innerHTML='<div class="searching" style="grid-column:1/-1">영화를 찾는 중...</div>';try{const url='https://ko.wikipedia.org/w/api.php?action=query&list=search&srnamespace=0&srlimit=24&srprop=snippet&srsearch='+encodeURIComponent('intitle:"'+q+'" 영화')+'&format=json&origin=*';let data=await fetch(url).then(r=>r.json());let hits=data.query?.search||[];if(!hits.length){const u2='https://ko.wikipedia.org/w/api.php?action=query&list=search&srnamespace=0&srlimit=24&srprop=snippet&srsearch='+encodeURIComponent(q+' 영화')+'&format=json&origin=*';data=await fetch(u2).then(r=>r.json());hits=data.query?.search||[]}
const ids=hits.map(x=>x.pageid).join('|');if(!ids){$('movieResults').innerHTML='<div class="searchEmpty" style="grid-column:1/-1">검색 결과가 없어요.</div>';return}const purl='https://ko.wikipedia.org/w/api.php?action=query&pageids='+ids+'&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=500&exintro=1&explaintext=1&format=json&origin=*';const pd=await fetch(purl).then(r=>r.json());let pages=Object.values(pd.query?.pages||{});pages=pages.filter(p=>p.title&&!/배우|가수|드라마|텔레비전|소설|노래|동명이인/.test(p.title));movieResults=pages.slice(0,18);$('movieResults').innerHTML=movieResults.length?movieResults.map((p,i)=>'<button class="searchTile" data-i="'+i+'"><img src="'+esc(p.thumbnail?.source||'')+'" onerror="this.style.opacity=.12"><div class="movieTitle">'+esc(p.title.replace(/ \(영화\)$/,''))+'</div><div class="searchYear">'+extractYear(p.extract||'')+'</div></button>').join(''):'<div class="searchEmpty" style="grid-column:1/-1">검색 결과가 없어요.</div>';qs('.searchTile').forEach(b=>b.onclick=()=>selectMovie(movieResults[Number(b.dataset.i)]))}catch(e){$('movieResults').innerHTML='<div class="searchEmpty" style="grid-column:1/-1">검색을 불러오지 못했어요.</div>'}}
function extractYear(s){const m=s.match(/(?:19|20)\d{2}/);return m?m[0]:''}
async function selectMovie(p){selectedMovie={title:p.title.replace(/ \(영화\)$/,''),poster:p.thumbnail?.source||'',year:extractYear(p.extract||''),director:'',actors:'',overview:p.extract||'',wiki:p.title};rating=0;renderRating();$('ratePoster').src=selectedMovie.poster;$('rateTitle').textContent=selectedMovie.title;show('movieRateScreen');await loadMovieDetails(p.title)}
async function loadMovieDetails(title){try{const url='https://ko.wikipedia.org/w/api.php?action=parse&page='+encodeURIComponent(title)+'&prop=text&format=json&origin=*';const data=await fetch(url).then(r=>r.json());const html=data.parse?.text?.['*']||'';const doc=new DOMParser().parseFromString(html,'text/html');const rows=[...doc.querySelectorAll('table.infobox tr')];let director='',actors='',release='';rows.forEach(tr=>{const th=tr.querySelector('th');const td=tr.querySelector('td');if(!th||!td)return;const k=th.textContent.replace(/\s+/g,'').trim();const v=td.textContent.replace(/\s+/g,' ').trim();if(/감독/.test(k))director=v;if(/주연|출연/.test(k)&&!actors)actors=v;if(/개봉|공개/.test(k)&&!release)release=v});selectedMovie.director=director;selectedMovie.actors=actors;selectedMovie.release=release;selectedMovie.year=extractYear(release)||selectedMovie.year;renderAutoInfo()}catch(e){renderAutoInfo()}}
function renderRating(){let h='';for(let i=1;i<=5;i++)h+='<button class="bigStar '+(i<=rating?'':'off')+'" data-r="'+i+'">★</button>';$('rateBtns').innerHTML=h;qs('.bigStar').forEach(b=>b.onclick=()=>{rating=Number(b.dataset.r);renderRating()})}
function movieTopHTML(){return '<div style="text-align:center"><img class="detailMoviePoster" src="'+esc(selectedMovie.poster)+'"><div class="detailMovieTitle">'+esc(selectedMovie.title)+'</div><div class="movieStars" style="font-size:18px">'+stars(rating)+'</div></div>'}
function renderAutoInfo(){$('movieInfoTop').innerHTML=movieTopHTML();$('movieAutoInfo').innerHTML='<div class="autoRow"><div class="autoLabel">개봉</div><div class="autoValue">'+esc(selectedMovie.year||selectedMovie.release||'정보 없음')+'</div></div><div class="autoRow"><div class="autoLabel">감독</div><div class="autoValue">'+esc(selectedMovie.director||'정보 없음')+'</div></div><div class="autoRow"><div class="autoLabel">배우</div><div class="autoValue">'+esc(selectedMovie.actors||'정보 없음')+'</div></div>';}
function startPersonal(){renderAutoInfo();$('moviePersonalTop').innerHTML=movieTopHTML();$('movieDate').value=today();$('moviePlace').value='';$('movieWho').value='';$('movieReview').value='';show('moviePersonalScreen')}
function showMovieDetail(e){editingMovieIndex=movies.indexOf(e);$('movieDetail').innerHTML='<div class="detailMovie"><img class="detailMoviePoster" src="'+esc(e.poster||'')+'"><div class="detailMovieTitle">'+esc(e.title)+'</div><div class="movieStars">'+stars(e.rating)+'</div></div><div class="detailInfo"><div class="detailInfoRow"><div class="detailInfoLabel">개봉</div><div>'+esc(e.year||'-')+'</div></div><div class="detailInfoRow"><div class="detailInfoLabel">감독</div><div>'+esc(e.director||'-')+'</div></div><div class="detailInfoRow"><div class="detailInfoLabel">배우</div><div>'+esc(e.actors||'-')+'</div></div><div class="detailInfoRow"><div class="detailInfoLabel">날짜</div><div>'+esc(e.date||'-')+'</div></div><div class="detailInfoRow"><div class="detailInfoLabel">장소</div><div>'+esc(e.place||'-')+'</div></div><div class="detailInfoRow"><div class="detailInfoLabel">함께</div><div>'+esc(e.who||'-')+'</div></div><div class="review">'+esc(e.review||'')+'</div></div>';show('movieDetailScreen')}
function editMovie(){const e=movies[editingMovieIndex];if(!e)return;selectedMovie={title:e.title,poster:e.poster,year:e.year,director:e.director,actors:e.actors,release:e.release||'',overview:e.overview||'',wiki:e.wiki||e.title};rating=e.rating||0;renderRating();$('ratePoster').src=e.poster;$('rateTitle').textContent=e.title;show('movieRateScreen');loadMovieDetails(e.wiki||e.title)}
$('homeBtn').onclick=()=>{$('menuPanel').classList.toggle('hidden')};document.addEventListener('click',e=>{if(!e.target.closest('#homeBtn')&&!e.target.closest('#menuPanel'))$('menuPanel').classList.add('hidden')});$('diaryMenu').onclick=()=>{renderDiaryList();show('diaryListScreen')};$('movieMenu').onclick=()=>{renderMovies();show('movieListScreen')};$('todayBtn').onclick=()=>{view=new Date();renderCalendar();show('calendarScreen')};$('prevMonth').onclick=()=>monthMove(-1);$('nextMonth').onclick=()=>monthMove(1);$('addBtn').onclick=()=>openDate(today());
qs('[data-calendar]').forEach(b=>b.onclick=()=>show('calendarScreen'));qs('[data-movies]').forEach(b=>b.onclick=()=>{renderMovies();show('movieListScreen')});
$('saveDiary').onclick=()=>{const e={date:selectedDate,mood:selectedMood,title:$('diaryTitle').value.trim(),body:$('diaryBody').value};diaries=diaries.filter(x=>x.date!==selectedDate);diaries.push(e);persist();renderCalendar();renderDiaryList();showDiaryDetail(e)};
$('moviePlus').onclick=()=>{$('movieQuery').value='';$('movieResults').innerHTML='';show('movieSearchScreen');setTimeout(()=>$('movieQuery').focus(),50)};$('movieQuery').oninput=()=>{clearTimeout(window.mgTimer);window.mgTimer=setTimeout(searchMovies,350)};$('movieQuery').onkeydown=e=>{if(e.key==='Enter')searchMovies()};$('clearSearch').onclick=()=>{$('movieQuery').value='';$('movieResults').innerHTML='';$('movieQuery').focus()};
$('rateNext').onclick=()=>{renderAutoInfo();show('movieInfoScreen')};$('infoNext').onclick=startPersonal;$('rateClose').onclick=()=>{renderMovies();show('movieListScreen')};
$('saveMovie').onclick=()=>{const data={title:selectedMovie.title,poster:selectedMovie.poster,rating,year:selectedMovie.year||'',director:selectedMovie.director||'',actors:selectedMovie.actors||'',release:selectedMovie.release||'',overview:selectedMovie.overview||'',wiki:selectedMovie.wiki||selectedMovie.title,date:$('movieDate').value,place:$('moviePlace').value.trim(),who:$('movieWho').value.trim(),review:$('movieReview').value};if(editingMovieIndex>=0){movies[editingMovieIndex]=data}else movies.push(data);editingMovieIndex=-1;persist();renderMovies();show('movieListScreen')};
$('movieDetailMenuBtn').onclick=()=>{$('movieEditMenu').classList.toggle('hidden')};$('editMovie').onclick=()=>{$('movieEditMenu').classList.add('hidden');editMovie()};$('deleteMovie').onclick=()=>{if(editingMovieIndex>=0){movies.splice(editingMovieIndex,1);persist();renderMovies();show('movieListScreen')}};
let sx=0,sy=0;document.addEventListener('touchstart',e=>{if(!$('calendarScreen').classList.contains('active'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',e=>{if(!$('calendarScreen').classList.contains('active'))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)&&dx>0){renderDiaryList();show('diaryListScreen')}else if(Math.abs(dy)>55&&Math.abs(dy)>Math.abs(dx))monthMove(dy<0?1:-1)},{passive:true});
renderCalendar();
})();
</script>
</body></html>
