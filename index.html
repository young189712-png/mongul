<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdfb">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

<title>몽글</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#fff8f5;
color:#514845;
font-family:"Gaegu",cursive;
font-size:17px;
}

button,input,textarea{
font:inherit;
}

button{
border:0;
background:none;
color:inherit;
}

#app{
width:min(100%,430px);
min-height:100vh;
margin:auto;
background:#fffdfb;
overflow:hidden;
}

.top{
height:58px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
position:sticky;
top:0;
background:#fffdfb;
z-index:10;
}

.logo{
font-size:25px;
font-weight:700;
}

.icon{
font-size:24px;
padding:4px 8px;
}

.screen{
display:none;
min-height:calc(100vh - 58px);
padding:12px 20px 80px;
}

.screen.active{
display:block;
}

.month{
display:flex;
align-items:center;
justify-content:space-between;
text-align:center;
margin:8px 0 16px;
}

.year{
font-size:16px;
}

.monthname{
font-size:25px;
font-weight:700;
}

.arrow{
font-size:30px;
padding:4px 12px;
}

.week{
display:grid;
grid-template-columns:repeat(7,1fr);
text-align:center;
font-size:16px;
margin-bottom:5px;
}

.cal{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}

.day{
min-height:52px;
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
font-size:19px;
}

.day.today{
background:#fff0e8;
font-weight:700;
}

.dot{
position:absolute;
bottom:6px;
width:7px;
height:7px;
border-radius:50%;
background:#e6a6b9;
}

.fab{
position:fixed;
right:max(calc((100vw - 430px)/2 + 18px),18px);
bottom:24px;
width:55px;
height:55px;
border-radius:50%;
background:#f3c6d0;
font-size:30px;
box-shadow:0 4px 15px #ddc9c2;
}

.back{
font-size:30px;
}

.date{
font-size:18px;
text-align:center;
margin:3px;
}

.title{
font-size:26px;
line-height:1.3;
margin:20px 0;
}

.moods{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.mood{
padding:10px;
border-radius:20px;
background:#fff7f3;
}

.cloud{
width:64px;
height:50px;
border-radius:50%;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
}

.mood-name{
text-align:center;
margin-top:5px;
}

.yellow{background:#ffe69a}
.pink{background:#f8c7d5}
.orange{background:#ffd0a8}
.gray{background:#ddd8d5}
.blue{background:#c9dff5}
.red{background:#f4b6b0}
.purple{background:#d9c8ed}
.green{background:#cce8c8}
.mint{background:#c9ebe3}

.writebox{
display:flex;
flex-direction:column;
gap:12px;
}

.input,
.textarea{
width:100%;
border:1px solid #eee0da;
border-radius:16px;
background:white;
padding:12px 14px;
outline:none;
}

.input{
font-size:21px;
}

.textarea{
min-height:280px;
resize:none;
font-size:19px;
line-height:1.5;
}

.primary{
width:100%;
padding:12px;
border-radius:18px;
background:#f2c5cf;
font-size:20px;
}

.listitem{
padding:15px 4px;
border-bottom:1px solid #eee4df;
}

.listdate{
font-size:15px;
color:#9b8c86;
}

.listtitle{
font-size:21px;
margin-top:3px;
}

.empty{
text-align:center;
color:#aa9b95;
margin-top:80px;
}

.menu{
position:fixed;
inset:0;
background:#0003;
z-index:30;
display:none;
}

.menu.open{
display:block;
}

.panel{
width:245px;
height:100%;
background:#fffdfb;
padding:70px 25px;
}

.panel button{
display:block;
width:100%;
text-align:left;
padding:16px 4px;
font-size:22px;
}

.moviehead{
display:flex;
align-items:center;
justify-content:space-between;
}

.plus{
font-size:30px;
}

.movies{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.moviecard{
background:#fff7f3;
border-radius:16px;
overflow:hidden;
}

.poster{
width:100%;
aspect-ratio:2/3;
object-fit:cover;
background:#eee;
}

.movieinfo{
padding:8px;
}

.movietitle{
font-size:19px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.stars{
color:#e5a13a;
letter-spacing:1px;
}

.search{
display:flex;
gap:7px;
margin:10px 0;
}

.search input{
flex:1;
}

.results{
display:flex;
flex-direction:column;
gap:8px;
}

.result{
display:flex;
gap:10px;
padding:9px;
border-radius:14px;
background:#fff7f3;
}

.result img{
width:58px;
height:78px;
object-fit:cover;
border-radius:8px;
}

.result b{
font-size:19px;
}

.small{
font-size:15px;
color:#8f817b;
}

.detailmovie{
text-align:center;
}

.detailmovie img{
width:150px;
max-height:220px;
object-fit:cover;
border-radius:12px;
}

.starsel{
font-size:30px;
color:#e5a13a;
margin:10px;
}

.field{
margin:10px 0;
}

.movie-review{
min-height:130px;
}

.next{
margin-top:12px;
}
</style>
</head>

<body>

<div id="app">

<header class="top">
<button class="icon" id="menuBtn">☰</button>
<div class="logo">몽글</div>
<button class="icon" id="homeBtn">⌂</button>
</header>

<section id="calendarScreen" class="screen active">

<div class="month">

<button class="arrow" id="prev">‹</button>

<div>
<div class="year" id="year"></div>
<div class="monthname" id="month"></div>
</div>

<button class="arrow" id="next">›</button>

</div>

<div class="week">
<span>일</span>
<span>월</span>
<span>화</span>
<span>수</span>
<span>목</span>
<span>금</span>
<span>토</span>
</div>

<div id="calendar" class="cal"></div>

<button class="fab" id="add">＋</button>

</section>


<section id="moodScreen" class="screen">

<button class="back" data-back>‹</button>

<div class="date" id="moodDate"></div>

<div class="title">
오늘의 감정을<br>
골라보세요
</div>

<div id="moods" class="moods"></div>

</section>


<section id="writeScreen" class="screen">

<button class="back" data-back>‹</button>

<div class="date" id="writeDate"></div>

<div class="title" id="chosen"></div>

<div class="writebox">

<input id="diaryTitle"
class="input"
placeholder="오늘은 어떤 하루였나요?">

<textarea
id="diaryBody"
class="textarea"
placeholder="천천히 적어보세요."
></textarea>

<button class="primary" id="saveDiary">
기록하기
</button>

</div>

</section>


<section id="detailScreen" class="screen">

<button class="back" data-back>‹</button>

<div id="detail"></div>

</section>


<section id="diaryListScreen" class="screen">

<div class="title">
내 일기
</div>

<div id="diaryList"></div>

</section>


<section id="movieScreen" class="screen">

<div class="moviehead">

<div class="title" style="margin:0">
내 영화
</div>

<button class="plus" id="movieAdd">
＋
</button>

</div>

<div id="movieList" class="movies"></div>

</section>


<section id="movieSearchScreen" class="screen">

<button class="back" data-back-movie>‹</button>

<div class="title">
영화 찾기
</div>

<div class="search">

<input
id="movieQuery"
class="input"
placeholder="영화 제목을 입력">

<button
class="primary"
id="movieSearch"
style="width:70px">
검색
</button>

</div>

<div id="movieResults" class="results"></div>

</section>


<section id="movieRateScreen" class="screen">

<button class="back" data-back-movie>‹</button>

<div id="movieRate"></div>

</section>


<section id="movieInfoScreen" class="screen">

<button class="back" data-back-movie>‹</button>

<div id="movieInfo"></div>

</section>


<section id="movieMemoScreen" class="screen">

<button class="back" data-back-movie>‹</button>

<div id="movieMemo"></div>

</section>

</div>


<div id="menu" class="menu">

<div class="panel">

<button id="menuDiary">
일기 목록
</button>

<button id="menuMovie">
영화 목록
</button>

</div>

</div>


<script>

const moods=[

{id:"happy",name:"기분 좋아요",c:"yellow",f:"⌣"},

{id:"love",name:"설레요",c:"pink",f:"⌣"},

{id:"curious",name:"궁금해요",c:"orange",f:"◉"},

{id:"tired",name:"지쳤어요",c:"gray",f:"﹏"},

{id:"sad",name:"슬퍼요",c:"blue",f:"︱"},

{id:"angry",name:"화나요",c:"red",f:"⌁"},

{id:"surprised",name:"놀랐어요",c:"purple",f:"•"},

{id:"down",name:"우울해요",c:"gray",f:"⌢"},

{id:"calm",name:"평온해요",c:"green",f:"⌣"},

{id:"blank",name:"무덤덤해요",c:"mint",f:"–"}

];


let entries=
JSON.parse(localStorage.getItem("mongle_entries")||"{}");

let movies=
JSON.parse(localStorage.getItem("mongle_movies")||"[]");

let cur=new Date();

let selectedDate=null;

let selectedMood=null;

let selectedMovie=null;


const $=s=>document.querySelector(s);


function key(d){

return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

}


function fmt(d){

return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;

}


function show(id){

document.querySelectorAll(".screen")
.forEach(x=>x.classList.remove("active"));

$("#"+id).classList.add("active");

window.scrollTo(0,0);

}


function calendar(){

let y=cur.getFullYear();

let m=cur.getMonth();

$("#year").textContent=y;

$("#month").textContent=
["1월","2월","3월","4월","5월","6월",
"7월","8월","9월","10월","11월","12월"][m];

let c=$("#calendar");

c.innerHTML="";

let first=new Date(y,m,1).getDay();

let days=new Date(y,m+1,0).getDate();

for(let i=0;i<first;i++){

c.appendChild(document.createElement("div"));

}

for(let n=1;n<=days;n++){

let d=new Date(y,m,n);

let e=entries[key(d)];

let x=document.createElement("div");

x.className="day";

if(key(d)==key(new Date()))
x.classList.add("today");

x.innerHTML=n+(e?
'<span class="dot"></span>':
"");

x.onclick=()=>e?
detail(d):
mood(d);

c.appendChild(x);

}

}


function mood(d){

selectedDate=d;

$("#moodDate").textContent=fmt(d);

$("#writeDate").textContent=fmt(d);

$("#moods").innerHTML=moods.map(m=>`

<button class="mood">

<div class="cloud ${m.c}">
${m.f}
</div>

<div class="mood-name">
${m.name}
</div>

</button>

`).join("");

document.querySelectorAll(".mood")
.forEach((b,i)=>{

b.onclick=()=>{

selectedMood=moods[i];

$("#chosen").textContent=
"오늘의 기분 · "+selectedMood.name;

show("writeScreen");

};

});

show("moodScreen");

}


function detail(d){

let e=entries[key(d)];

let m=
moods.find(x=>x.id==e.mood)
||moods[0];

$("#detail").innerHTML=`

<div class="date">
${fmt(d)}
</div>

<div class="title">
${m.name}
</div>

<h2>
${e.title||"제목 없음"}
</h2>

<p style="
white-space:pre-wrap;
font-size:19px;
line-height:1.6
">
${e.body||""}
</p>

`;

show("detailScreen");

}


$("#prev").onclick=()=>{

cur.setMonth(cur.getMonth()-1);

calendar();

};


$("#next").onclick=()=>{

cur.setMonth(cur.getMonth()+1);

calendar();

};


$("#add").onclick=()=>mood(new Date());


$("#saveDiary").onclick=()=>{

entries[key(selectedDate)]={

mood:selectedMood.id,

title:$("#diaryTitle").value,

body:$("#diaryBody").value

};

localStorage.setItem(
"mongle_entries",
JSON.stringify(entries)
);

$("#diaryTitle").value="";

$("#diaryBody").value="";

cur=new Date(selectedDate);

calendar();

detail(selectedDate);

};


document.querySelectorAll("[data-back]")
.forEach(b=>{

b.onclick=()=>show("calendarScreen");

});


function diaryList(){

let a=Object.keys(entries)
.sort()
.reverse();

if(!a.length){

$("#diaryList").innerHTML=
'<div class="empty">아직 기록한 일기가 없어요.</div>';

}else{

$("#diaryList").innerHTML=a.map(k=>`

<div class="listitem"
onclick="detail(new Date('${k}T00:00:00'))">

<div class="listdate">
${k}
</div>

<div class="listtitle">
${entries[k].title||"제목 없음"}
</div>

</div>

`).join("");

}

show("diaryListScreen");

}


function movieList(){

if(!movies.length){

$("#movieList").innerHTML=
'<div class="empty" style="grid-column:1/-1">
아직 기록한 영화가 없어요.<br>
오른쪽 위 ＋를 눌러 추가해보세요.
</div>';

}else{

$("#movieList").innerHTML=
movies.map((m,i)=>`

<div class="moviecard"
onclick="movieDetail(${i})">

<img
class="poster"
src="${m.poster||''}"
onerror="this.style.visibility='hidden'">

<div class="movieinfo">

<div class="movietitle">
${m.title}
</div>

<div class="stars">
${"★".repeat(m.rating||0)}
${"☆".repeat(5-(m.rating||0))}
</div>

</div>

</div>

`).join("");

}

show("movieScreen");

}


async function searchMovie(){

let q=$("#movieQuery").value.trim();

if(!q)return;

$("#movieResults").innerHTML=
'<div class="empty">찾는 중...</div>';

try{

let url=
"https://ko.wikipedia.org/w/api.php?action=query"+
"&generator=search"+
"&gsrsearch="+encodeURIComponent(q)+
"&gsrnamespace=0"+
"&gsrlimit=10"+
"&prop=pageimages"+
"&pithumbsize=300"+
"&format=json"+
"&origin=*";

let response=await fetch(url);

let data=await response.json();

let pages=
Object.values(data.query?.pages||{});

if(!pages.length){

$("#movieResults").innerHTML=
'<div class="empty">검색 결과가 없어요.</div>';

return;

}

$("#movieResults").innerHTML=
pages.map(p=>`

<div class="result"
onclick='chooseMovie(${JSON.stringify({
title:p.title,
poster:p.thumbnail?.source||""
})})'>

<img
src="${p.thumbnail?.source||""}"
onerror="this.style.visibility='hidden'">

<div>

<b>
${p.title}
</b>

<div class="small">
이 영화를 선택해서 기록하기
</div>

</div>

</div>

`).join("");

}catch(e){

$("#movieResults").innerHTML=
'<div class="empty">검색을 불러오지 못했어요.</div>';

}

}


function chooseMovie(m){

selectedMovie=m;

$("#movieRate").innerHTML=`

<div class="detailmovie">

<img src="${m.poster||""}">

<h2>
${m.title}
</h2>

<div class="starsel"
id="starSel">
☆☆☆☆☆
</div>

<button
class="primary next"
onclick="movieNext()">
다음
</button>

</div>

`;

let r=0;

$("#starSel").onclick=()=>{

r=r%5+1;

$("#starSel").textContent=
"★".repeat(r)+
"☆".repeat(5-r);

selectedMovie.rating=r;

};

show("movieRateScreen");

}


function movieNext(){

selectedMovie.rating=
selectedMovie.rating||3;

$("#movieInfo").innerHTML=`

<div class="title">
${selectedMovie.title}
</div>

<div class="field">

<input
id="movieYear"
class="input"
placeholder="개봉년도">

</div>

<div class="field">

<input
id="movieDirector"
class="input"
placeholder="감독">

</div>

<div class="field">

<input
id="movieActors"
class="input"
placeholder="배우">

</div>

<button
class="primary next"
onclick="movieNext2()">
다음
</button>

`;

show("movieInfoScreen");

}


function movieNext2(){

selectedMovie.year=$("#movieYear").value;

selectedMovie.director=
$("#movieDirector").value;

selectedMovie.actors=
$("#movieActors").value;

$("#movieMemo").innerHTML=`

<div class="title">
${selectedMovie.title}
</div>

<div class="field">

<input
id="movieDate"
type="date"
class="input">

</div>

<div class="field">

<input
id="moviePlace"
class="input"
placeholder="어디서 봤나요?">

</div>

<div class="field">

<input
id="movieWho"
class="input"
placeholder="누구와 봤나요?">

</div>

<div class="field">

<textarea
id="movieReview"
class="input movie-review"
placeholder="영화 리뷰">
</textarea>

</div>

<button
class="primary"
onclick="saveMovie()">
영화 기록하기
</button>

`;

show("movieMemoScreen");

}


function saveMovie(){

selectedMovie.date=
$("#movieDate").value;

selectedMovie.place=
$("#moviePlace").value;

selectedMovie.who=
$("#movieWho").value;

selectedMovie.review=
$("#movieReview").value;

movies.unshift(selectedMovie);

localStorage.setItem(
"mongle_movies",
JSON.stringify(movies)
);

movieList();

}


function movieDetail(i){

let m=movies[i];

$("#movieRate").innerHTML=`

<div class="detailmovie">

<img src="${m.poster||""}">

<h2>
${m.title}
</h2>

<div class="stars">

${"★".repeat(m.rating||0)}
${"☆".repeat(5-(m.rating||0))}

</div>

<p>
${m.year||""}
·
${m.director||""}
</p>

<p>
${m.date||""}
·
${m.place||""}
·
${m.who||""}
</p>

<p style="white-space:pre-wrap">
${m.review||""}
</p>

</div>

`;

show("movieRateScreen");

}


$("#movieSearch").onclick=searchMovie;


$("#movieQuery").onkeydown=e=>{

if(e.key=="Enter")
searchMovie();

};


$("#movieAdd").onclick=()=>{

$("#movieQuery").value="";

$("#movieResults").innerHTML="";

show("movieSearchScreen");

};


document.querySelectorAll("[data-back-movie]")
.forEach(b=>{

b.onclick=()=>movieList();

});


$("#menuBtn").onclick=()=>{

$("#menu").classList.add("open");

};


$("#menu").onclick=e=>{

if(e.target.id=="menu")
$("#menu").classList.remove("open");

};


$("#menuDiary").onclick=()=>{

$("#menu").classList.remove("open");

diaryList();

};


$("#menuMovie").onclick=()=>{

$("#menu").classList.remove("open");

movieList();

};


$("#homeBtn").onclick=()=>{

show("calendarScreen");

};


let sy=0;

let sx=0;


$("#calendarScreen")
.addEventListener("touchstart",e=>{

sy=e.touches[0].clientY;

sx=e.touches[0].clientX;

});


$("#calendarScreen")
.addEventListener("touchend",e=>{

let dy=e.changedTouches[0].clientY-sy;

let dx=e.changedTouches[0].clientX-sx;

if(
Math.abs(dy)>45 &&
Math.abs(dy)>Math.abs(dx)
){

cur.setMonth(
cur.getMonth()+(dy<0?1:-1)
);

calendar();

}

else if(dx<-55){

diaryList();

}

});


calendar();


if("serviceWorker" in navigator){

navigator.serviceWorker.register("sw.js");

}

</script>

</body>
</html>
